<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="blueClothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12232e"/>
      <stop offset="50%" stop-color="#1f3647"/>
      <stop offset="100%" stop-color="#0c171e"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#fff1b0"/>
      <stop offset="100%" stop-color="#997a15"/>
    </linearGradient>
    <filter id="bookShadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="600" height="800" fill="#f4efe6"/>
  <!-- Book base with shadow -->
  <g filter="url(#bookShadow2)" transform="translate(60, 50)">
    <!-- Cover -->
    <rect x="0" y="0" width="480" height="700" rx="16" fill="url(#blueClothGrad)" stroke="#070e13" stroke-width="3"/>
    <!-- Spine texture line -->
    <line x1="38" y1="0" x2="38" y2="700" stroke="#060c10" stroke-width="4"/>
    <line x1="42" y1="0" x2="42" y2="700" stroke="url(#silverGrad)" stroke-width="1.5" opacity="0.6"/>
    <!-- Geometric Victorian / Art Nouveau Border -->
    <rect x="65" y="45" width="375" height="610" rx="8" fill="none" stroke="url(#silverGrad)" stroke-width="2"/>
    <rect x="73" y="53" width="359" height="594" rx="4" fill="none" stroke="url(#silverGrad)" stroke-width="0.8"/>
    <!-- Geometric medallion -->
    <polygon points="252,220 295,265 252,310 209,265" fill="none" stroke="url(#silverGrad)" stroke-width="2"/>
    <circle cx="252" cy="265" r="26" fill="none" stroke="url(#silverGrad)" stroke-width="1"/>
    <text x="252" y="272" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="url(#silverGrad)" text-anchor="middle">❧</text>
    <!-- Titles -->
    <text x="252" y="380" font-family="'Newsreader', Georgia, serif" font-size="27" font-weight="600" fill="url(#silverGrad)" text-anchor="middle" letter-spacing="4">ASTRONOMIA NOVA</text>
    <text x="252" y="415" font-family="'Newsreader', Georgia, serif" font-size="16" font-style="italic" fill="#f3dfa2" text-anchor="middle" letter-spacing="2">ENCUADERNACIÓN EN TELA &amp; PAN DE ORO</text>
    <line x1="170" y1="445" x2="335" y2="445" stroke="url(#silverGrad)" stroke-width="1.5"/>
    <text x="252" y="480" font-family="sans-serif" font-size="13" font-weight="600" fill="#d8bc68" text-anchor="middle" letter-spacing="3">PRAGA • IMPRESIÓN HISTÓRICA</text>
    <text x="252" y="575" font-family="sans-serif" font-size="12" fill="#a48a41" text-anchor="middle" letter-spacing="2">PIEZA ÚNICA DE ARCHIVO EDITORIAL</text>
  </g>
</svg>
