<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" aria-label="Ilustración editorial de un espacio de lectura en una librería">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F5EF"/>
      <stop offset="50%" stop-color="#EFECE3"/>
      <stop offset="100%" stop-color="#E5E0D5"/>
    </linearGradient>

    <!-- Warm Sunlight Glow -->
    <radialGradient id="sunGlow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#FFF9EA" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#F6E7D2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E5E0D5" stop-opacity="0"/>
    </radialGradient>

    <!-- Accent Terracotta Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D96B48"/>
      <stop offset="100%" stop-color="#C45B38"/>
    </linearGradient>

    <!-- Book Spine Gradient 1 -->
    <linearGradient id="spine1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D3A34"/>
      <stop offset="100%" stop-color="#1E2723"/>
    </linearGradient>

    <!-- Book Spine Gradient 2 -->
    <linearGradient id="spine2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C45B38"/>
      <stop offset="100%" stop-color="#A5492A"/>
    </linearGradient>

    <!-- Book Spine Gradient 3 -->
    <linearGradient id="spine3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4B07B"/>
      <stop offset="100%" stop-color="#B89461"/>
    </linearGradient>

    <!-- Glass Overlay Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1C1B1A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="900" rx="24" fill="url(#bgGrad)"/>
  <rect width="1200" height="900" rx="24" fill="url(#sunGlow)"/>

  <!-- Architectural Window / Light Ray Geometry -->
  <g opacity="0.35">
    <path d="M700 0 L1200 0 L1200 900 L400 900 Z" fill="#FFFFFF" opacity="0.4"/>
    <line x1="850" y1="0" x2="600" y2="900" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8 8"/>
    <line x1="1050" y1="0" x2="800" y2="900" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8 8"/>
  </g>

  <!-- Bookshelf Background Structure (Minimalist Grid Lines) -->
  <g stroke="#1C1B1A" stroke-opacity="0.07" stroke-width="1.5">
    <!-- Horizontal Shelves -->
    <line x1="120" y1="280" x2="1080" y2="280"/>
    <line x1="120" y1="520" x2="1080" y2="520"/>
    <line x1="120" y1="760" x2="1080" y2="760"/>

    <!-- Vertical Dividers -->
    <line x1="380" y1="120" x2="380" y2="760"/>
    <line x1="760" y1="120" x2="760" y2="760"/>
  </g>

  <!-- Books Layer (Top Shelf) -->
  <g filter="url(#softShadow)">
    <!-- Book Row Shelf 1 -->
    <rect x="160" y="160" width="32" height="120" rx="3" fill="url(#spine1)"/>
    <rect x="196" y="145" width="28" height="135" rx="3" fill="url(#spine2)"/>
    <rect x="228" y="170" width="36" height="110" rx="3" fill="url(#spine3)"/>
    <rect x="268" y="150" width="24" height="130" rx="3" fill="#6A7B72"/>
    <rect x="296" y="165" width="40" height="115" rx="3" fill="#2D3A34"/>

    <!-- Leaning Book -->
    <g transform="translate(340, 280) rotate(14) translate(-340, -280)">
      <rect x="330" y="150" width="26" height="130" rx="3" fill="url(#accentGrad)"/>
    </g>
  </g>

  <!-- Central Featured Composition (Middle Shelf) -->
  <g filter="url(#softShadow)">
    <!-- Large Open Book / Architectural Motif -->
    <g transform="translate(420, 360)">
      <!-- Left Page -->
      <path d="M20 120 C 60 115, 140 125, 170 135 L 170 20 C 140 10, 60 0, 20 10 Z" fill="#FAF8F5" stroke="#E0DACF" stroke-width="1.5"/>
      <!-- Right Page -->
      <path d="M170 135 C 200 125, 280 115, 320 120 L 320 10 C 280 0, 200 10, 170 20 Z" fill="#FFFDF9" stroke="#E0DACF" stroke-width="1.5"/>
      <!-- Book Spine Center -->
      <line x1="170" y1="20" x2="170" y2="135" stroke="#C45B38" stroke-width="2.5"/>
      
      <!-- Minimalist Text Lines on Page -->
      <line x1="50" y1="35" x2="140" y2="42" stroke="#1C1B1A" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round"/>
      <line x1="50" y1="55" x2="150" y2="62" stroke="#1C1B1A" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round"/>
      <line x1="50" y1="75" x2="130" y2="82" stroke="#1C1B1A" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round"/>
      <line x1="50" y1="95" x2="145" y2="102" stroke="#1C1B1A" stroke-opacity="0.15" stroke-width="2" stroke-linecap="round"/>

      <line x1="190" y1="42" x2="290" y2="35" stroke="#1C1B1A" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round"/>
      <line x1="190" y1="62" x2="280" y2="55" stroke="#1C1B1A" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round"/>
      <line x1="190" y1="82" x2="295" y2="75" stroke="#1C1B1A" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round"/>
      <line x1="190" y1="102" x2="270" y2="95" stroke="#1C1B1A" stroke-opacity="0.15" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Stack of Curated Hardcovers -->
    <g transform="translate(800, 390)">
      <rect x="0" y="90" width="220" height="30" rx="4" fill="#2D3A34"/>
      <rect x="15" y="60" width="190" height="28" rx="4" fill="url(#accentGrad)"/>
      <rect x="30" y="32" width="160" height="26" rx="4" fill="#D4B07B"/>
      <rect x="45" y="8" width="130" height="22" rx="4" fill="#4A564F"/>

      <!-- Bookmark Ribbon -->
      <path d="M 120 34 L 120 100 L 130 92 L 140 100 L 140 34 Z" fill="#C45B38" opacity="0.9"/>
    </g>
  </g>

  <!-- Bottom Shelf Elements & Coffee/Tea Cup -->
  <g transform="translate(180, 640)" filter="url(#softShadow)">
    <!-- Stacked Large Art Volumes -->
    <rect x="0" y="80" width="280" height="40" rx="5" fill="#1E2723"/>
    <rect x="20" y="42" width="240" height="36" rx="5" fill="#E6DFD3" stroke="#D5CEBF" stroke-width="1"/>
    
    <!-- Warm Ceramic Cup -->
    <g transform="translate(340, 50)">
      <!-- Saucer -->
      <ellipse cx="40" cy="65" rx="50" ry="12" fill="#E0DACF"/>
      <!-- Cup Body -->
      <path d="M10 20 C10 50, 20 60, 40 60 C60 60, 70 50, 70 20 Z" fill="#FAF8F5" stroke="#D5CEBF" stroke-width="2"/>
      <!-- Handle -->
      <path d="M68 25 C82 25, 82 45, 66 48" fill="none" stroke="#D5CEBF" stroke-width="3" stroke-linecap="round"/>
      <!-- Steam Lines -->
      <path d="M30 10 Q35 0 30 -10" fill="none" stroke="#C45B38" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>
      <path d="M48 12 Q53 2 48 -8" fill="none" stroke="#C45B38" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Floating Glass Card (Editorial Badge Accent) -->
  <g transform="translate(720, 610)" filter="url(#softShadow)">
    <rect width="360" height="110" rx="16" fill="url(#glassGrad)" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="1.5"/>
    
    <!-- Decorative Monogram Ring -->
    <circle cx="55" cy="55" r="28" fill="#C45B38" fill-opacity="0.1" stroke="#C45B38" stroke-width="1.5"/>
    <text x="55" y="63" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#C45B38" text-anchor="middle">L</text>
    
    <text x="100" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#1C1B1A" letter-spacing="0.5">ESPACIO EDITORIAL</text>
    <text x="100" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#66625D">Curaduría independiente &amp; lectura pausada</text>
  </g>
</svg>
